interface:
  display_name: "Design Workflow"
  short_description: "도메인에 맞는 디자인을 제안하고 UI·차트·영상·3D 그래픽을 구현합니다"
  default_prompt: "$design-workflow로 시스템·도메인과 사용자 과업을 분석하고, 필요한 경우 쉬운 연출 이름과 보완 요청문을 제안해 주세요. 모션·차트·영상·3D·게임형 그래픽을 사용 가능한 무료·유료 기능에 맞춰 시안으로 선택하고 제작·웹 연결·검증까지 진행하며, 불만족 피드백은 원인을 찾아 해당 디자인·구현 또는 재사용 지침을 개선해 주세요."
